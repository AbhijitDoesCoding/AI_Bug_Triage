# workflows/release-notes/release_notes.toml
# Lemma workflow configuration (TOML reference).
# The authoritative format is release-notes.json — this file is a human-readable reference.

name = "release-notes"
description = "When a bug is marked Fixed, drafts a user-facing release note, gets human approval, and saves the approved note back to the bug."
visibility = "POD"

# ── Trigger ──────────────────────────────────────────────────────────────────
# Fires on every UPDATE to the bugs table. The check_fixed DECISION filters to
# status == 'Fixed' AND release_notes_approved != true. That second clause is the
# re-entry guard: when save_release_note sets release_notes_approved = true, the
# resulting UPDATE fires this workflow again, but the guard routes it straight to
# END instead of drafting a second note (no infinite loop).

[start]
type = "DATASTORE_EVENT"

[start.config]
table_name = "bugs"
operations = ["UPDATE"]

# ── Nodes ────────────────────────────────────────────────────────────────────

# 1. Guard: only proceed for a freshly-Fixed bug that has no approved note yet.
[[nodes]]
id = "check_fixed"
type = "DECISION"
label = "Fixed and not yet approved?"

[[nodes.config.rules]]
condition = "start.payload.status == 'Fixed' && start.payload.release_notes_approved != `true`"
next_node_id = "draft_note"

# 2. release_writer drafts the note. NOTE: the changed row's id is at
#    start.metadata.record_id for DATASTORE_EVENT triggers — NOT start.payload.id.
[[nodes]]
id = "draft_note"
type = "AGENT"
label = "Draft Release Note"

[nodes.config]
agent_name = "release_writer"

[nodes.config.input_mapping.bug_id]
type = "expression"
value = "start.metadata.record_id"

# 3. Human approval — pauses the run; the form pre-fills the drafted note so the
#    reviewer can edit it in place before approving.
[[nodes]]
id = "approval"
type = "FORM"
label = "Review & Approve Release Note"

[nodes.config.input_schema]
type = "object"
required = ["approved"]

[nodes.config.input_schema.properties.approved]
type = "boolean"
title = "Approve this release note?"

[nodes.config.input_schema.properties.edited_note]
type = "string"
title = "Release note (edit before approving if needed)"
# default is a dynamic binding to the drafted note (resolved when the form suspends):
# default = { type = "expression", value = "draft_note.release_note", optional = true }

# 4. Route on the approval decision.
[[nodes]]
id = "approve_route"
type = "DECISION"
label = "Approved?"

[[nodes.config.rules]]
condition = "approval.approved == `true`"
next_node_id = "save_note"

# 5. Persist the approved note and set release_notes_approved = true.
[[nodes]]
id = "save_note"
type = "FUNCTION"
label = "Save Approved Note"

[nodes.config]
function_name = "save_release_note"

[nodes.config.input_mapping.bug_id]
type = "expression"
value = "start.metadata.record_id"

[nodes.config.input_mapping.note]
type = "expression"
value = "approval.edited_note"

# 6. Terminal
[[nodes]]
id = "end"
type = "END"
label = "Done"

# ── Edges ────────────────────────────────────────────────────────────────────
# DECISION routing = rules (next_node_id jumps) + the FIRST-listed outgoing edge as
# the default/else branch.

[[edges]]
id = "e1"
source = "check_fixed"
target = "end"           # default: not fixed / already approved

[[edges]]
id = "e2"
source = "draft_note"
target = "approval"

[[edges]]
id = "e3"
source = "approval"
target = "approve_route"

[[edges]]
id = "e4"
source = "approve_route"
target = "end"           # default: not approved

[[edges]]
id = "e5"
source = "save_note"
target = "end"
