# tables/bugs.toml
# Lemma table schema for the bugs table (TOML reference).
# The authoritative format is bugs.json — this file is a human-readable reference.

name = "bugs"
primary_key_column = "id"
enable_rls = false
visibility = "POD"

[[columns]]
name = "title"
type = "TEXT"
required = true
max_length = 240

[[columns]]
name = "priority"
type = "ENUM"
required = true
default = "Medium"
options = ["Low", "Medium", "High"]

[[columns]]
name = "raw_complaint"
type = "TEXT"
required = true

[[columns]]
name = "repro_steps"
type = "TEXT"
required = false

[[columns]]
name = "status"
type = "ENUM"
required = true
default = "Open"
options = ["Open", "In_Progress", "Fixed"]

[config]
