# agents/triage_agent.toml
# Lemma agent configuration for the triage brain (TOML reference).
# The authoritative format is triage_agent.json + instruction.md — this file is a
# human-readable reference. The full system prompt lives in instruction.md (loaded via
# {"$file": "instruction.md"}); it is not duplicated here to avoid drift.

name = "triage_agent"
description = "Conversational triage brain: dedups and structures unstructured bug reports into the bugs table."
visibility = "POD"
toolsets = ["POD"]

# instruction = { "$file" = "instruction.md" }   # see instruction.md

[permissions]
[[permissions.grants]]
resource_type = "datastore_table"
resource_name = "bugs"
permission_ids = [
  "datastore.table.read",
  "datastore.record.read",
  "datastore.record.write",
]
